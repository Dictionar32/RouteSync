name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # jsonResourceWrap.spec.ts menjalankan refleksi PHP terhadap fixture
      # Laravel (guard phpAvailable() akan skip test kalau PHP tidak ada).
      - name: Setup PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli

      - name: Install dependencies
        run: npm ci

      - name: Build (tsup)
        run: npm run build

      - name: Test (vitest)
        run: npx vitest run
